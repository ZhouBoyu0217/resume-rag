<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历知识库 · 问答</title>
<style>
:root {
  color-scheme: dark;
  --void: #0A0D14;
  --deep: #11161F;
  --panel: rgba(22, 28, 40, .55);
  --panel-solid: #161B26;
  --edge: rgba(140, 170, 220, .12);
  --edge-lit: rgba(227, 194, 126, .45);
  --ink: #E4E8F0;
  --ink-dim: #8B96AC;
  --ink-faint: #5A6479;
  --gold: #E3C27E;
  --gold-soft: rgba(227, 194, 126, .14);
  --jade: #3FB7A5;
  --jade-soft: rgba(63, 183, 165, .12);
  --ember: #E0646B;
  --ember-soft: rgba(224, 100, 107, .12);
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--ink);
  font: 14.5px/1.75 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-weight: 300;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============ 背景：深空粒子 + 光晕 ============ */
#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.aurora {
  position: fixed; inset: -10%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(35% 30% at 18% 10%, rgba(62, 105, 200, .18), transparent 70%),
    radial-gradient(28% 24% at 85% 92%, rgba(227, 194, 126, .12), transparent 70%),
    radial-gradient(22% 18% at 72% 22%, rgba(63, 183, 165, .09), transparent 70%);
  animation: drift 30s ease-in-out infinite alternate;
}
@keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(2%, -2%, 0) scale(1.06); } }

/* 鼠标光斑：小、淡，只做一点"被照到"的暗示 */
.spot {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
  background: radial-gradient(150px circle at var(--mx, 50%) var(--my, 30%), rgba(140, 180, 245, .055), transparent 70%);
  transition: opacity .5s ease;
}

/* ============ 布局 ============ */
.shell {
  position: relative; z-index: 2;
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr);
  grid-template-rows: 100vh;
  height: 100vh;
  max-height: 100vh;
  gap: 0;
}

/* ---- 左栏：档案柜 ---- */
.rail {
  display: flex; flex-direction: column;
  background: rgba(16, 21, 31, .72);
  border-right: 1px solid var(--edge);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  padding: 26px 20px 20px;
  opacity: 0; transform: translateX(-14px);
  transition: opacity .45s ease, transform .45s ease;
}
.rail.in { opacity: 1; transform: none; }

.brand { display: flex; align-items: baseline; gap: 9px; margin-bottom: 3px; }
.brand .mark {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 10px rgba(227,194,126,.9), 0 0 24px rgba(227,194,126,.45);
  animation: beacon 3s ease-in-out infinite;
  flex: none; align-self: center;
}
@keyframes beacon {
  0%,100% { box-shadow: 0 0 10px rgba(227,194,126,.9), 0 0 24px rgba(227,194,126,.45); }
  50%     { box-shadow: 0 0 16px rgba(227,194,126,1), 0 0 40px rgba(227,194,126,.65); }
}
.brand h1 { font-size: 16px; font-weight: 400; letter-spacing: .04em; }
.brand-sub { font-size: 12px; color: var(--ink-faint); margin-bottom: 20px; letter-spacing: .02em; }

.stats {
  display: flex; gap: 0; margin-bottom: 20px;
  border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
  padding: 11px 0;
}
.stat { flex: 1; display: flex; flex-direction: column; }
.stat + .stat { border-left: 1px solid var(--edge); padding-left: 14px; }
.stat b { font-family: var(--mono); font-size: 19px; font-weight: 300; color: var(--gold); line-height: 1.3; }
.stat span { font-size: 11px; color: var(--ink-faint); }

/* 无主块提示 */
.orphan-box {
  font-size: 11.5px; line-height: 1.7; color: #E8C98E;
  background: rgba(227,194,126,.08); border: 1px solid rgba(227,194,126,.26);
  border-radius: 8px; padding: 8px 10px; margin-bottom: 14px;
  display: flex; flex-direction: column; gap: 6px;
}
.orphan-box[hidden] { display: none; }
.orphan-box b { font-family: var(--mono); font-weight: 400; }
.orphan-box button {
  align-self: flex-start; cursor: pointer; font: inherit; font-size: 11.5px;
  background: rgba(227,194,126,.16); color: var(--gold);
  border: 1px solid rgba(227,194,126,.35); border-radius: 5px; padding: 2px 10px;
  transition: background .2s ease;
}
.orphan-box button:hover { background: rgba(227,194,126,.28); }

.rail-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--ink-dim); margin-bottom: 10px;
}

.res-list { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.res-list::-webkit-scrollbar { width: 5px; }
.res-list::-webkit-scrollbar-thumb { background: rgba(140,170,220,.18); border-radius: 3px; }

.res-item {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px 9px 12px; margin-bottom: 6px;
  border: 1px solid transparent; border-radius: 10px;
  cursor: pointer;
  transition: background .22s ease, border-color .22s ease, transform .22s ease;
  opacity: 0; transform: translateY(8px);
  animation: slideIn .42s cubic-bezier(.22,.8,.3,1) forwards;
}
@keyframes slideIn { to { opacity: 1; transform: none; } }
.res-item:hover { background: rgba(255,255,255,.035); border-color: var(--edge); }
.res-item.active { background: var(--gold-soft); border-color: rgba(227,194,126,.32); }
.res-item.active .res-name { color: var(--gold); }
.res-item.fresh { animation: flash .8s ease-out; }
@keyframes flash {
  0%   { background: rgba(227,194,126,.26); box-shadow: 0 0 0 1px rgba(227,194,126,.5); }
  100% { background: transparent; box-shadow: none; }
}
.res-dot {
  flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 0;
  background: var(--jade); box-shadow: 0 0 8px rgba(63,183,165,.7);
}
.res-dot.missing { background: var(--ink-faint); box-shadow: none; }
.res-main { flex: 1; min-width: 0; }
.res-name {
  font-size: 14px; color: var(--ink); font-weight: 400;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.res-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
/* 操作按钮常驻显示、加大点击区：
   原来 hover 才出现，鼠标一移开就找不到，且 3px 内边距太小容易点偏。
   现在 28×28 的点击区，图标 16px，使用 opacity 变化做轻微反馈。 */
.res-actions { display: flex; gap: 3px; opacity: 0.75; transition: opacity .2s ease; }
.res-item:hover .res-actions, .res-item:focus-within .res-actions { opacity: 1; }
.icon-btn {
  border: none; background: none; color: var(--ink-dim); cursor: pointer;
  font-size: 13px; padding: 3px 5px; border-radius: 5px; line-height: 1;
  transition: background .18s ease, color .18s ease;
}
.res-actions .icon-btn {
  width: 28px; height: 28px; padding: 0;
  display: inline-grid; place-items: center;
  font-size: 16px; line-height: 1; border-radius: 7px;
}
.res-actions .icon-btn:hover { background: rgba(255,255,255,.09); color: var(--ink); }
.res-actions .icon-btn.danger:hover { background: var(--ember-soft); color: var(--ember); }

/* 上传按钮 */
.upload-tip { margin-top: 9px; font-size: 11px; line-height: 1.75; color: var(--ink-faint); }
.upload-tip code {
  font-family: var(--mono); font-size: 10.5px;
  background: rgba(255,255,255,.05); padding: 1px 4px; border-radius: 3px;
}
.upload-zone { margin-top: 14px; }
.btn-upload {
  width: 100%; padding: 11px 14px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: transparent; color: var(--ink);
  border: 1px dashed rgba(227,194,126,.38); border-radius: 10px;
  font-size: 13.5px; font-family: inherit; font-weight: 300;
  cursor: pointer; position: relative; overflow: hidden;
  transition: border-color .22s ease, background .22s ease, color .22s ease;
}
.btn-upload::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(227,194,126,.16) 50%, transparent 70%);
  transform: translateX(-100%);
}
.btn-upload:hover { border-color: var(--edge-lit); background: rgba(227,194,126,.06); color: var(--gold); }
.btn-upload:hover::before { animation: sheen 1.1s ease-out; }
@keyframes sheen { to { transform: translateX(100%); } }
.btn-upload.busy { pointer-events: none; color: var(--gold); border-color: var(--edge-lit); }
.btn-upload.busy::after {
  content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 40%;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  animation: scan 1s linear infinite;
}
@keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(350%); } }

/* ---- 右栏：对话区 ---- */
/* min-height:0 是滚动容器的关键：
   flex 子项默认 min-height:auto = 内容高度，内容一长就把容器撑高，
   溢出到视口外，而 body 又是 overflow:hidden，结果滚不到。
   加上这个才会真正生成内部滚动条。 */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; position: relative; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 34px 14px;
  border-bottom: 1px solid var(--edge);
  background: rgba(10, 13, 20, .35);
  backdrop-filter: blur(14px);
  opacity: 0; transform: translateY(-8px);
  transition: opacity .45s ease .1s, transform .45s ease .1s;
}
.topbar.in { opacity: 1; transform: none; }

.mode-switch {
  display: flex; padding: 3px; border-radius: 9px;
  background: rgba(255,255,255,.04); border: 1px solid var(--edge);
}
.mode-switch button {
  border: none; background: none; color: var(--ink-dim);
  font: inherit; font-size: 12.5px; padding: 5px 14px;
  border-radius: 6px; cursor: pointer;
  transition: background .22s ease, color .22s ease;
}
.mode-switch button.on { background: rgba(227,194,126,.15); color: var(--gold); }
.mode-switch button:not(.on):hover { color: var(--ink); background: rgba(255,255,255,.03); }
.mode-hint { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-family: var(--mono); }
.rail-toggle { font-size: 17px !important; padding: 4px 8px !important; }

.chat-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scroll-behavior: smooth; }
.chat-scroll::-webkit-scrollbar { width: 6px; }
.chat-scroll::-webkit-scrollbar-thumb { background: rgba(140,170,220,.16); border-radius: 3px; }
.chat-inner { max-width: 840px; margin: 0 auto; padding: 34px 34px 20px; }

/* 空状态 */
.empty {
  padding: 9vh 0 0; text-align: center;
  animation: rise .6s cubic-bezier(.22,.8,.3,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.empty h2 {
  font-size: clamp(24px, 3vw, 32px); font-weight: 200; letter-spacing: .06em;
  background: linear-gradient(100deg, #9FB4D6 20%, #F4E6C6 50%, #9FB4D6 80%);
  background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 5s ease-in-out infinite;
  margin-bottom: 12px;
}
@keyframes shimmer { 0%,100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
.empty p { color: var(--ink-dim); font-size: 13.5px; margin-bottom: 28px; }
.suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 600px; margin: 0 auto; }
.chip {
  padding: 9px 16px; border-radius: 999px; cursor: pointer;
  background: rgba(255,255,255,.035); border: 1px solid var(--edge);
  color: var(--ink-dim); font-size: 13px; font-family: inherit;
  transition: border-color .22s ease, color .22s ease, background .22s ease, transform .22s ease;
}
.chip:hover { border-color: var(--edge-lit); color: var(--gold); background: rgba(227,194,126,.07); transform: translateY(-1px); }

/* 消息 */
.msg { margin-bottom: 26px; animation: msgIn .38s cubic-bezier(.22,.8,.3,1) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble {
  max-width: 72%;
  background: linear-gradient(135deg, rgba(227,194,126,.16), rgba(227,194,126,.08));
  border: 1px solid rgba(227,194,126,.26);
  padding: 11px 16px; border-radius: 14px 14px 4px 14px;
  color: #F2EAD8;
}
.msg.bot { display: flex; gap: 12px; }
.avatar {
  flex: none; width: 28px; height: 28px; border-radius: 8px; margin-top: 2px;
  display: grid; place-items: center;
  background: rgba(63,183,165,.12); border: 1px solid rgba(63,183,165,.28);
  color: var(--jade); font-size: 12px; font-family: var(--mono);
}
.msg.bot .body { flex: 1; min-width: 0; }

/* 回答里的富文本（模型输出的 Markdown 子集）*/
.answer { color: var(--ink); word-break: break-word; line-height: 1.85; font-size: 15px; }
.answer .md-p { margin: 0 0 10px; white-space: pre-wrap; }
.answer .md-p:last-child { margin-bottom: 0; }
.answer strong { color: var(--gold); font-weight: 500; }
.answer code {
  font-family: var(--mono); font-size: 12.5px;
  color: #7FD8CB; background: rgba(63,183,165,.10);
  border: 1px solid rgba(63,183,165,.18);
  padding: 1px 5px; border-radius: 4px; white-space: nowrap;
}
.answer ul, .answer ol { margin: 6px 0 12px; padding-left: 22px; }
.answer li { margin: 4px 0; color: var(--ink); }
.answer ul li::marker { color: var(--jade); }
.answer ol li::marker { color: var(--jade); font-family: var(--mono); font-size: 13px; }
.answer h3 { font-size: 15px; font-weight: 500; color: var(--ink); margin: 14px 0 8px; }

.answer .caret {
  display: inline-block; width: 7px; height: 1em; vertical-align: -2px; margin-left: 2px;
  background: var(--gold); box-shadow: 0 0 10px rgba(227,194,126,.8);
  animation: blink .9s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* 思考中 */
.thinking { display: flex; align-items: center; gap: 10px; color: var(--ink-faint); font-size: 13px; }
.dots { display: inline-flex; gap: 4px; }
.dots i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
  animation: bounce 1.15s ease-in-out infinite;
}
.dots i:nth-child(2) { animation-delay: .14s; }
.dots i:nth-child(3) { animation-delay: .28s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .45; }
  30% { transform: translateY(-5px); opacity: 1; box-shadow: 0 0 10px rgba(227,194,126,.9); }
}

/* 引用卡片 */
.sources { margin-top: 14px; border-top: 1px solid var(--edge); padding-top: 4px; }
.src-toggle {
  display: flex; align-items: center; gap: 7px; width: 100%;
  background: none; border: none; cursor: pointer;
  color: var(--jade); font: inherit; font-size: 12.5px;
  padding: 7px 0; text-align: left;
}
.src-toggle .tri { display: inline-block; transition: transform .25s ease; font-size: 10px; }
.sources.open .src-toggle .tri { transform: rotate(90deg); }
.src-toggle:hover { color: #6FD9C6; }
.src-body {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows .3s cubic-bezier(.22,.8,.3,1);
}
.sources.open .src-body { grid-template-rows: 1fr; }
.src-inner { overflow: hidden; }
.src-card {
  border-left: 2px solid rgba(63,183,165,.45);
  background: rgba(63,183,165,.05);
  padding: 9px 12px; margin: 8px 0;
  border-radius: 0 8px 8px 0;
}
.src-meta { display: flex; gap: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-bottom: 4px; }
.src-meta b { color: var(--jade); font-weight: 400; }
.src-text { font-size: 12.5px; color: var(--ink-dim); line-height: 1.7; white-space: pre-wrap; }
.src-text.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.src-more { border: none; background: none; color: var(--gold); font: inherit; font-size: 11.5px; cursor: pointer; padding: 2px 0 0; }

/* 输入区 */
.composer-wrap {
  padding: 10px 34px 22px;
  background: linear-gradient(to top, var(--void) 45%, transparent);
  opacity: 0; transform: translateY(8px);
  transition: opacity .45s ease .15s, transform .45s ease .15s;
}
.composer-wrap.in { opacity: 1; transform: none; }
.composer {
  max-width: 840px; margin: 0 auto;
  display: flex; align-items: flex-end; gap: 10px;
  background: var(--panel-solid);
  border: 1px solid var(--edge); border-radius: 14px;
  padding: 8px 8px 8px 16px;
  transition: border-color .25s ease, box-shadow .25s ease;
}
.composer:focus-within {
  border-color: var(--edge-lit);
  box-shadow: 0 0 0 3px rgba(227,194,126,.09), 0 8px 32px rgba(0,0,0,.4);
}
.composer textarea {
  flex: 1; resize: none; border: none; outline: none; background: none;
  color: var(--ink); font: inherit; font-size: 14.5px; line-height: 1.65;
  padding: 7px 0; max-height: 140px; min-height: 24px;
}
.composer textarea::placeholder { color: var(--ink-faint); }
.send {
  flex: none; width: 34px; height: 34px; border-radius: 9px; border: none; cursor: pointer;
  display: grid; place-items: center;
  background: rgba(227,194,126,.16); color: var(--gold);
  transition: background .2s ease, transform .2s ease, opacity .2s ease;
}
.send:hover:not(:disabled) { background: rgba(227,194,126,.28); transform: translateY(-1px); }
.send:disabled { opacity: .35; cursor: default; }
.send svg { width: 15px; height: 15px; }
.composer-foot {
  max-width: 840px; margin: 8px auto 0;
  display: flex; justify-content: space-between;
  font-size: 11.5px; color: var(--ink-faint);
}
.api-link { color: var(--ink-faint); text-decoration: none; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
.api-link:hover { color: var(--gold); border-bottom-color: rgba(227,194,126,.45); }
.foot-right { display: inline-flex; gap: 16px; align-items: baseline; }
.composer-foot kbd {
  font-family: var(--mono); font-size: 10.5px;
  border: 1px solid var(--edge); border-radius: 4px; padding: 1px 5px;
}

/* 错误提示条：贴底、右对齐。
   放顶部会正好盖住"跨简历分析"按钮，让人以为是它坏了——这是踩过的真坑。 */
.toast-stack {
  position: fixed; bottom: 86px; right: 22px; z-index: 50;
  display: flex; flex-direction: column; gap: 8px;
  align-items: flex-end;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  min-width: 240px; max-width: 380px;
  padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.6;
  backdrop-filter: blur(16px);
  border: 1px solid; animation: toastIn .3s cubic-bezier(.22,.8,.3,1);
  display: flex; gap: 9px; align-items: flex-start;
}
.toast.out { animation: toastOut .25s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(16px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(16px); } }
.toast.warn { background: rgba(227,194,126,.12); border-color: rgba(227,194,126,.4); color: #F0DCAE; }
.toast.err { background: rgba(224,100,107,.12); border-color: rgba(224,100,107,.4); color: #F3B4B6; }
.toast.info { background: rgba(63,183,165,.1); border-color: rgba(63,183,165,.35); color: #8FE3D3; }

/* 焦点可见（无障碍硬要求） */
button:focus-visible, .res-item:focus-visible, textarea:focus-visible, .chip:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 2px;
}

/* 引用标签（键盘/读屏可达，同时是视觉提示） */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* 移动端 */
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .rail {
    position: fixed; inset: 0 auto 0 0; width: 290px; z-index: 30;
    transform: translateX(-100%); opacity: 1; transition: transform .3s cubic-bezier(.22,.8,.3,1);
    box-shadow: 20px 0 60px rgba(0,0,0,.6);
  }
  .rail.open { transform: none; }
  .rail.in { transform: translateX(-100%); }
  .rail.open.in { transform: none; }
  .topbar { padding: 14px 16px 12px; gap: 8px; }
  .mode-switch button { padding: 5px 10px; font-size: 12px; }
  .chat-inner { padding: 22px 16px 12px; }
  .composer-wrap { padding: 8px 16px 16px; }
  .hide-sm { display: none; }
  .toast-stack { left: 12px; right: 12px; bottom: 96px; align-items: stretch; }
  .toast { max-width: none; min-width: 0; }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.5); backdrop-filter: blur(2px); display: none; }
  .scrim.on { display: block; }
}
@media (min-width: 821px) { .scrim, .rail-toggle { display: none; } }

/* ============ 简历详情抽屉 ============ */
.drawer-scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(4, 7, 12, .55); backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none;
  transition: opacity .28s ease;
}
.drawer-scrim.on { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
  width: min(560px, 92vw);
  display: flex; flex-direction: column;
  background: #12171F;
  border-left: 1px solid var(--edge);
  box-shadow: -24px 0 70px rgba(0, 0, 0, .55);
  transform: translateX(100%);
  transition: transform .32s cubic-bezier(.22, .8, .3, 1);
}
.drawer.on { transform: none; }

.drawer-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; padding: 20px 22px 14px;
  border-bottom: 1px solid var(--edge);
}
.drawer-title h2 { font-size: 17px; font-weight: 400; letter-spacing: .03em; }
.drawer-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
.drawer-close { font-size: 20px !important; line-height: 1; }

.drawer-tabs {
  display: flex; gap: 2px; padding: 10px 18px 0;
  border-bottom: 1px solid var(--edge);
}
.drawer-tabs button {
  border: none; background: none; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--ink-dim);
  padding: 8px 12px 10px; border-radius: 6px 6px 0 0;
  border-bottom: 2px solid transparent;
  transition: color .2s ease, border-color .2s ease;
}
.drawer-tabs button:hover { color: var(--ink); }
.drawer-tabs button.on { color: var(--gold); border-bottom-color: var(--gold); }

.drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px 28px; }
.drawer-body::-webkit-scrollbar { width: 6px; }
.drawer-body::-webkit-scrollbar-thumb { background: rgba(140,170,220,.16); border-radius: 3px; }

.d-pane[hidden] { display: none; }
.d-loading { display: flex; align-items: center; gap: 9px; color: var(--ink-faint); font-size: 13px; }
.d-summary { font-size: 14px; line-height: 1.9; color: var(--ink); white-space: pre-wrap; }
.d-link {
  margin-top: 12px; border: none; background: none; cursor: pointer;
  color: var(--gold); font: inherit; font-size: 12px; padding: 0;
  border-bottom: 1px solid rgba(227,194,126,.35);
}
.d-full {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.85;
  color: var(--ink-dim); white-space: pre-wrap; word-break: break-word;
}

.d-toolbar { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 18px; }
.d-toolbar.col { flex-direction: column; align-items: stretch; }
.d-label {
  display: flex; flex-direction: column; gap: 6px; flex: 1;
  font-size: 12px; color: var(--ink-faint);
}
.d-input, .d-textarea {
  background: rgba(255,255,255,.04); border: 1px solid var(--edge);
  border-radius: 8px; color: var(--ink); font: inherit; font-size: 13px;
  padding: 8px 11px; outline: none; resize: vertical;
  transition: border-color .2s ease;
}
.d-input:focus, .d-textarea:focus { border-color: var(--edge-lit); }
.d-btn {
  flex: none; padding: 9px 18px; border-radius: 8px; cursor: pointer;
  background: rgba(227,194,126,.16); color: var(--gold);
  border: 1px solid rgba(227,194,126,.35);
  font: inherit; font-size: 13px;
  transition: background .2s ease;
}
.d-btn:hover:not(:disabled) { background: rgba(227,194,126,.28); }
.d-btn:disabled { opacity: .45; cursor: default; }

/* 打分结果 */
.score-hero { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.score-num { font-family: var(--mono); font-size: 44px; font-weight: 300; color: var(--gold); line-height: 1; }
.score-unit { font-size: 12px; color: var(--ink-faint); }
.score-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.07); overflow: hidden; margin-bottom: 22px; }
.score-bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #B89A57, var(--gold)); transition: width .8s cubic-bezier(.22,.8,.3,1); }
.dim { margin-bottom: 14px; }
.dim-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.dim-top b { font-weight: 400; color: var(--ink); }
.dim-top span { font-family: var(--mono); color: var(--gold); font-size: 12px; }
.dim-ev { font-size: 12px; color: var(--ink-faint); line-height: 1.7; }
.d-list { margin: 16px 0 0; padding: 0; list-style: none; }
.d-list li { position: relative; padding-left: 16px; font-size: 13px; line-height: 1.8; color: var(--ink-dim); }
.d-list li::before { content: ""; position: absolute; left: 0; top: 11px; width: 5px; height: 5px; border-radius: 50%; }
.d-list.good li::before { background: var(--jade); }
.d-list.bad li::before { background: var(--ember); }
.d-list.tip li::before { background: var(--gold); }
.d-section-title { font-size: 12px; color: var(--ink-faint); margin: 20px 0 8px; letter-spacing: .04em; }

/* JD 匹配结果 */
.match-score { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.match-ring {
  --p: 0; flex: none; width: 78px; height: 78px; border-radius: 50%;
  display: grid; place-items: center;
  background: conic-gradient(var(--jade) calc(var(--p) * 1%), rgba(255,255,255,.07) 0);
  position: relative;
}
.match-ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #12171F; }
.match-ring b { position: relative; font-family: var(--mono); font-size: 21px; font-weight: 300; color: var(--jade); }
.match-summary { font-size: 13px; line-height: 1.8; color: var(--ink-dim); }
.req { padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
.req-head { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.req-badge { flex: none; font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 4px; margin-top: 2px; }
.req-badge.met { background: rgba(63,183,165,.15); color: var(--jade); }
.req-badge.partial { background: var(--gold-soft); color: var(--gold); }
.req-badge.missing { background: var(--ember-soft); color: var(--ember); }
.req-ev { font-size: 12px; color: var(--ink-faint); margin-top: 4px; padding-left: 2px; line-height: 1.7; }

@media (max-width: 820px) {
  .drawer { width: 100%; }
  .drawer-tabs { overflow-x: auto; }
  .drawer-tabs button { white-space: nowrap; }
}

/* 减少动态偏好 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .aurora { animation: none; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"></div>
<div class="spot" id="spot" aria-hidden="true"></div>

<div class="shell">
  <!-- 左栏 -->
  <aside class="rail" id="rail" aria-label="简历档案柜">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>简历档案柜</h1>
    </div>
    <div class="brand-sub">RAG · 检索增强问答</div>

    <div class="stats">
      <div class="stat"><b id="stResumes">0</b><span>份简历</span></div>
      <div class="stat"><b id="stChunks">0</b><span>个知识块</span></div>
    </div>

    <div class="orphan-box" id="orphanBox" hidden>
      <span>有 <b id="orphanCount">0</b> 个知识块没有简历归属（早期建库留下的），列表里看不到，但会参与检索。</span>
      <button id="orphanBtn" type="button">清理</button>
    </div>

    <div class="rail-head">
      <span>全部简历</span>
      <span id="railHint" style="color:var(--ink-faint);font-size:11px"></span>
    </div>
    <div class="res-list" id="resList" role="list" aria-live="polite"></div>

    <div class="upload-zone">
      <button class="btn-upload" id="btnUpload" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        上传简历 (.txt)
      </button>
      <input type="file" id="fileInput" accept=".txt" hidden>
      <div class="upload-tip">
        简历库存在后端的 <code>chroma_db/</code> 里。<br>
        上传时会同时归档原文并更新向量库。
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- 右栏 -->
  <main class="main">
    <div class="topbar" id="topbar">
      <button class="icon-btn rail-toggle" id="railToggle" aria-label="打开简历列表">☰</button>
      <div class="mode-switch" role="tablist" aria-label="问答模式">
        <button role="tab" id="tabChat" class="on" aria-selected="true">单份简历问答</button>
        <button role="tab" id="tabCompare" aria-selected="false">跨简历分析</button>
      </div>
      <span class="mode-hint hide-sm" id="modeHint">范围：未选中简历</span>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <div class="empty" id="empty">
          <h2>问简历里的任何细节</h2>
          <p>上传简历后，系统会切分、向量化并建立索引，回答时附带原始依据。</p>
          <div class="suggestions">
            <button class="chip" data-q="他有哪些项目经历？">他有哪些项目经历？</button>
            <button class="chip" data-q="他熟悉哪些技术？">他熟悉哪些技术？</button>
            <button class="chip" data-q="他什么时候毕业的？">他什么时候毕业的？</button>
            <button class="chip" data-q="他的 GPA 是多少？">他的 GPA 是多少？</button>
          </div>
        </div>
        <div id="messages" aria-live="polite"></div>
      </div>
    </div>

    <div class="composer-wrap" id="composerWrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="问点关于简历的事…" aria-label="输入问题"></textarea>
        <button class="send" id="btnSend" aria-label="发送" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        </button>
      </div>
      <div class="composer-foot">
        <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
        <span class="foot-right"><span id="statusLine">就绪</span><a class="api-link" href="/docs" target="_blank" rel="noopener">接口文档 /docs ↗</a></span>
      </div>
    </div>
  </main>
</div>
<div class="toast-stack" id="toasts" aria-live="assertive"></div>

<!-- 简历详情抽屉 -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" aria-label="简历详情" aria-hidden="true">
  <header class="drawer-head">
    <div class="drawer-title">
      <h2 id="drawerName">简历</h2>
      <span id="drawerMeta" class="drawer-meta"></span>
    </div>
    <button class="icon-btn drawer-close" id="drawerClose" aria-label="关闭">×</button>
  </header>

  <div class="drawer-tabs" role="tablist">
    <button role="tab" id="dTabSummary" class="on" aria-selected="true">概要</button>
    <button role="tab" id="dTabFull" aria-selected="false">全文</button>
    <button role="tab" id="dTabScore" aria-selected="false">综合评价</button>
    <button role="tab" id="dTabMatch" aria-selected="false">JD 匹配</button>
  </div>

  <div class="drawer-body">
    <!-- 概要 -->
    <section id="dPaneSummary" class="d-pane">
      <div class="d-loading" id="summaryLoading"><span class="dots"><i></i><i></i><i></i></span>正在生成概要…</div>
      <p class="d-summary" id="summaryText"></p>
      <button class="d-link" id="summaryRefresh" type="button" hidden>重新生成概要</button>
    </section>

    <!-- 全文 -->
    <section id="dPaneFull" class="d-pane" hidden>
      <pre class="d-full" id="fullText"></pre>
    </section>

    <!-- 综合评价 -->
    <section id="dPaneScore" class="d-pane" hidden>
      <div class="d-toolbar">
        <label class="d-label">按什么岗位标准打分
          <input id="scoreRole" class="d-input" value="大模型应用开发工程师">
        </label>
        <button class="d-btn" id="scoreBtn" type="button">开始评分</button>
      </div>
      <div id="scoreResult" class="d-result"></div>
    </section>

    <!-- JD 匹配 -->
    <section id="dPaneMatch" class="d-pane" hidden>
      <div class="d-toolbar col">
        <label class="d-label">粘贴岗位 JD
          <textarea id="jdText" class="d-textarea" rows="7" placeholder="把招聘网站的 JD 整段粘进来…"></textarea>
        </label>
        <button class="d-btn" id="matchBtn" type="button">分析匹配度</button>
      </div>
      <div id="matchResult" class="d-result"></div>
    </section>
  </div>
</aside>

<script>
/* =========================================================================
   简历知识库前端
   三层职责：DOM 结构在 HTML，样式在 CSS，这里只做 fetch / 渲染 / 状态。
   ========================================================================= */

const API = '';   // 同源部署，留空即可

const state = {
  resumes: [],
  activeId: null,        // 当前选中的简历（单份问答用）
  mode: 'chat',          // 'chat' | 'compare'
  busy: false,
  messages: [],          // {role, text, sources?, streaming?}
};

const $ = (id) => document.getElementById(id);
const el = {
  resList: $('resList'), stResumes: $('stResumes'), stChunks: $('stChunks'),
  railHint: $('railHint'), btnUpload: $('btnUpload'), fileInput: $('fileInput'),
  chatScroll: $('chatScroll'), chatInner: $('chatInner'), messages: $('messages'), empty: $('empty'),
  input: $('input'), btnSend: $('btnSend'), statusLine: $('statusLine'),
  tabChat: $('tabChat'), tabCompare: $('tabCompare'), modeHint: $('modeHint'),
  toasts: $('toasts'), spot: $('spot'), rail: $('rail'), scrim: $('scrim'),
  railToggle: $('railToggle'), topbar: $('topbar'), composerWrap: $('composerWrap'),
  orphanBox: $('orphanBox'), orphanCount: $('orphanCount'), orphanBtn: $('orphanBtn')
};

/* ---------------- 提示条 ---------------- */
function toast(msgText, kind = 'info', ms = 4200) {
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  const msg = document.createElement('span');
  msg.textContent = msgText;
  t.appendChild(msg);
  el.toasts.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, ms);
}

/* ---------------- 简历列表 ---------------- */
async function loadResumes() {
  try {
    const res = await fetch(`${API}/resumes`);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `HTTP ${res.status}`);
    }
    const list = await res.json();
    state.resumes = list;
    if (!state.activeId && list.length) state.activeId = list[0].resume_id;
    if (state.activeId && !list.some(r => r.resume_id === state.activeId)) {
      state.activeId = list.length ? list[0].resume_id : null;
    }
    renderResumes();
    loadHealth();
    if (!state.busy) setStatusReading();
  } catch (e) {
    el.railHint.textContent = '读取失败';
    const d = document.createElement('div');
    d.style.cssText = 'color:var(--ember);font-size:12.5px;padding:16px 4px;line-height:1.8;white-space:pre-wrap';
    d.textContent = `读取简历列表失败：\n${e.message}\n\n如果提示 Failed to fetch，说明后端没在 8001 上跑（或端口被别的进程占了）。`;
    el.resList.replaceChildren(d);
    toast('读取简历列表失败：' + e.message, 'err', 8000);
  }
}

async function loadHealth() {
  try {
    const res = await fetch(`${API}/health`);
    const h = await res.json();
    el.stResumes.textContent = h.resumes ?? 0;
    el.stChunks.textContent = h.chunks ?? 0;
    // 有"无主块"时提示：它们能参与检索，但列表里看不到，会污染问答
    const o = h.orphan_chunks || 0;
    el.orphanBox.hidden = o === 0;
    if (o) el.orphanCount.textContent = o;
  } catch { /* 计数非关键，失败不打扰 */ }
}

el.orphanBtn.addEventListener('click', async () => {
  if (!confirm('清掉这些没有简历归属的老块？它们来自早期 build_db.py，列表里看不到但会参与检索。')) return;
  try {
    const r = await fetch(`${API}/orphans`, { method: 'DELETE' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '清理失败');
    toast(`已清理 ${d.deleted} 个无主块`, 'info');
    await loadHealth();
  } catch (e) { toast(e.message, 'err'); }
});

function renderResumes() {
  el.resList.innerHTML = '';
  el.railHint.textContent = state.resumes.length ? `${state.resumes.length} 份` : '';
  if (!state.resumes.length) {
    const d = document.createElement('div');
    d.style.cssText = 'color:var(--ink-faint);font-size:12.5px;padding:18px 4px;line-height:1.8';
    d.textContent = '还没有简历。点下面的按钮传一份 .txt，就能开始提问。';
    el.resList.appendChild(d);
    return;
  }
  state.resumes.forEach((r, i) => {
    const item = document.createElement('div');
    item.className = 'res-item' + (r.resume_id === state.activeId ? ' active' : '');
    item.tabIndex = 0;
    item.setAttribute('role', 'listitem');
    item.style.animationDelay = `${i * 55}ms`;
    item.innerHTML = `
      <span class="res-dot ${r.has_raw ? '' : 'missing'}" title="${r.has_raw ? '原文已归档' : '原文缺失'}"></span>
      <div class="res-main">
        <div class="res-name"></div>
        <div class="res-meta">${escapeHtml(r.resume_id)}</div>
      </div>
      <div class="res-actions">
        <button class="icon-btn" data-act="open" title="查看简历详情" aria-label="查看简历详情">ⓘ</button>
        <button class="icon-btn" data-act="download" title="下载原文" aria-label="下载原文">↓</button>
        <button class="icon-btn danger" data-act="delete" title="删除" aria-label="删除">×</button>
      </div>`;
    item.querySelector('.res-name').textContent = r.resume_name;
    item.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'download') return downloadResume(r);
      if (act === 'delete') return deleteResume(r);
      if (act === 'open') return openDrawer(r);
      // 点名称：只选中（用于问答），不打扰；点 ⓘ 才看详情
      selectResume(r.resume_id);
    });
    item.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectResume(r.resume_id); }
    });
    el.resList.appendChild(item);
  });
}

function selectResume(id) {
  state.activeId = id;
  renderResumes();
  setStatusReading();
  closeRail();
}

async function downloadResume(r) {
  try {
    const res = await fetch(`${API}/resumes/${encodeURIComponent(r.resume_id)}/download`);
    if (!res.ok) throw new Error('原文缺失');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${r.resume_name}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { toast('下载失败：原文可能缺失', 'err'); }
}

async function deleteResume(r) {
  if (!confirm(`删除「${r.resume_name}」？切分块和原文都会被移除。`)) return;
  try {
    const res = await fetch(`${API}/resumes/${encodeURIComponent(r.resume_id)}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('删除失败');
    toast(`已删除「${r.resume_name}」`, 'info', 2600);
    if (drawerResume && drawerResume.resume_id === r.resume_id) closeDrawer();
    await loadResumes();
  } catch (e) { toast('删除失败，请重试', 'err'); }
}

/* ---------------- 上传 ---------------- */
function pickFile() { el.fileInput.click(); }

el.btnUpload.addEventListener('click', pickFile);
el.fileInput.addEventListener('change', () => {
  const f = el.fileInput.files[0];
  el.fileInput.value = '';
  if (f) uploadFile(f);
});

async function uploadFile(file) {
  if (!file.name.endsWith('.txt')) { toast('目前只支持 .txt 文件', 'warn'); return; }
  // 简历名默认取文件名，简单可用
  const name = prompt('给这份简历取个显示名（如：陈宇）', file.name.replace(/\.txt$/i, ''));
  if (!name) return;

  const fd = new FormData();
  fd.append('file', file);
  fd.append('resume_name', name.trim());

  el.btnUpload.classList.add('busy');
  el.btnUpload.innerHTML = '正在切分与向量化…';
  try {
    const r = await fetch(`${API}/upload`, { method: 'POST', body: fd });
    const data = await r.json().catch(() => ({}));
    if (r.status === 409) { toast(data.detail || '已存在同名简历', 'warn', 6000); return; }
    if (!r.ok) { toast(data.detail || `上传失败（${r.status}）`, 'err', 6000); return; }
    toast(`已入库「${name}」，${data.chunks} 个知识块`, 'info');

/* ---------------- 迷你 Markdown 渲染 ----------------
   只支持模型会用到的子集：加粗、行内代码、- 列表、1. 列表、### 小标题。
   安全策略：先整体转义，再插入标签，所以模型输出里的 HTML 标签只会显示成文字。
   流式场景下每收一段就重渲染一次，所以必须纯函数、无副作用。 */
function renderMarkdown(src) {
  const esc = escapeHtml(src);
  const lines = esc.split('\n');
  const out = [];
  let listType = null;   // 'ul' | 'ol' | null

  const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };

  const inline = (s) => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { closeList(); out.push('<div class="md-p" style="height:6px"></div>'); continue; }

    const h = line.match(/^#{1,4}\s+(.*)$/);
    if (h) { closeList(); out.push(`<h3>${inline(h[1])}</h3>`); continue; }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) {
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push(`<li>${inline(ul[1])}</li>`);
      continue;
    }

    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) {
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push(`<li>${inline(ol[1])}</li>`);
      continue;
    }

    closeList();
    out.push(`<div class="md-p">${inline(line)}</div>`);
  }
  closeList();
  return out.join('');
}

/* ---------------- 消息渲染 ---------------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------------- 提问：真流式 + 假流式降级 ---------------- */
async function ask() {
  const q = el.input.value.trim();
  if (!q || state.busy) return;
  if (state.mode === 'chat' && !state.activeId) {
    toast('先上传或选择一份简历', 'warn');
    return;
  }

  state.busy = true;
  el.input.value = '';
  autoGrow();
  setSendState();
  addUserMsg(q);
  const cur = state.resumes.find(r => r.resume_id === state.activeId);
  setStatusReading(cur ? cur.resume_name : '');
  modeHistory.push(q);

  if (state.mode === 'compare') {
    await askCompare(q);
  } else {
    await askStream(q);
  }

  state.busy = false;
  setSendState();
  setStatusReading();
}

function setSendState() {
  el.btnSend.disabled = state.busy || !el.input.value.trim();
}

const modeHistory = [];

async function askStream(q) {
  const shell = addBotShell('答');
  const think = shell.querySelector('.thinking');
  const phase = shell.querySelector('.phase');
  const answerEl = shell.querySelector('.answer');
  let started = false;
  let acc = '';
  let sources = null;

  // 2 秒后从"检索"切换到"生成"
  const phaseTimer = setTimeout(() => { if (!started) phase.textContent = '正在生成回答…'; }, 1800);

  el.statusLine.textContent = '正在检索…';
  const t0 = performance.now();

  try {
    // ---- 首选：真流式（SSE over fetch）----
    const res = await fetch(`${API}/chat/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, top_k: 6, resume_id: state.activeId }),
    });
    if (res.status === 409) { throw new Error('conflict'); }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // 按 SSE 的 "\n\n" 分帧
      let sep;
      while ((sep = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        const ev = (frame.match(/^event:\s*(.+)$/m) || [])[1];
        const dataLine = (frame.match(/^data:\s*(.+)$/m) || [])[1];
        if (!ev || !dataLine) continue;
        let payload; try { payload = JSON.parse(dataLine); } catch { continue; }

        if (ev === 'sources') {
          sources = payload;
          renderSources(shell, sources);
        } else if (ev === 'delta') {
          if (!started) {
            started = true;
            clearTimeout(phaseTimer);
            think.remove();
            answerEl.style.display = '';
            el.statusLine.textContent = '正在生成…';
          }
          acc += payload.text;
          answerEl.innerHTML = renderMarkdown(acc);
          scrollBottom();
        } else if (ev === 'error') {
          throw new Error(payload.message || '生成失败');
        } else if (ev === 'done') {
          /* 结束 */
        }
      }
    }
    if (!started) throw new Error('没有返回任何内容');
  } catch (e) {
    // 流式已开始 >1.5 秒说明网络其实通，只是中途断了：不降级，避免重复
    if (started && performance.now() - t0 > 1500) {
      answerEl.innerHTML = renderMarkdown(acc);
      toast('回答中断，请重试', 'err');
      return;
    }
    // ---- 降级：假流式（后端一次返回，前端逐字吐）----
    clearTimeout(phaseTimer);
    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, top_k: 6, resume_id: state.activeId }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      think.remove();
      answerEl.style.display = '';
      renderSources(shell, data.sources);
      await typewriter(answerEl, data.answer || '');
    } catch (e2) {
      think.innerHTML = `<span style="color:var(--ember)">连接失败，请检查后端服务（端口 8001）</span>`;
      toast('问答失败：无法连接服务', 'err', 6000);
    }
  } finally {
    clearTimeout(phaseTimer);
    setStatusReading();
  }
}

// 假流式：每 18ms 吐一个字
function typewriter(target, text) {
  return new Promise((resolve) => {
    let i = 0;
    const step = () => {
      if (!el.messages.contains(target)) return resolve();
      if (i >= text.length) {
        // 吐完之后再统一渲染 Markdown：
        // 逐字阶段如果直接渲染，未闭合的 ** 会露出星号，反而难看
        target.innerHTML = renderMarkdown(text);
        resolve();
        return;
      }
      const n = Math.min(text.length - i, 2);
      i += n;
      target.textContent = text.slice(0, i);
      scrollBottom();
      setTimeout(step, 12);
    };
    step();
  });
}

async function askCompare(q) {
  const shell = addBotShell('析');
  const think = shell.querySelector('.thinking');
  const phase = shell.querySelector('.phase');
  const answerEl = shell.querySelector('.answer');
  phase.textContent = '正在汇总全部简历摘要…（首次分析每份简历都要生成摘要，可能需要 1-2 分钟）';
  el.statusLine.textContent = '正在汇总…';

  const t0 = Date.now();
  const timer = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    phase.textContent = `正在汇总全部简历摘要…已等待 ${s} 秒（首次较慢，之后有缓存会快很多）`;
  }, 1000);

  try {
    const res = await fetch(`${API}/compare`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, top_k: 6 }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    think.remove();
    answerEl.style.display = '';
    shell.querySelector('.sources').style.display = 'none';
    await typewriter(answerEl, data.answer || '');
    if (data.count) {
      const note = document.createElement('div');
      note.style.cssText = 'margin-top:10px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)';
      note.textContent = `基于 ${data.count} 份简历摘要`;
      shell.querySelector('.body').appendChild(note);
    }
  } catch (e) {
    think.innerHTML = '<span style="color:var(--ember)">分析失败，请重试</span>';
    toast('跨简历分析失败：' + e.message, 'err');
  } finally {
    clearInterval(timer);
  }
}

});

function switchDrawerTab(name) {
  const map = {
    summary: [dEl.tabSummary, dEl.paneSummary],
    full: [dEl.tabFull, dEl.paneFull],
    score: [dEl.tabScore, dEl.paneScore],
    match: [dEl.tabMatch, dEl.paneMatch],
  };
  Object.entries(map).forEach(([k, [btn, pane]]) => {
    const on = k === name;
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-selected', on);
    pane.hidden = !on;
  });
  if (name === 'summary') loadSummary();
  if (name === 'full') loadFullText();
}

/* ---- 综合评价 ---- */
// 复用上面的 escapeHtml，不重复定义（重复定义容易写坏正则）
function esc(s) {
  return escapeHtml(s ?? '');
}

const DIM_NAMES = { tech: '技术栈完整度', project: '项目深度', impact: '量化成果', clarity: '表达质量' };

function renderScore(data) {
  if (data._parse_failed) {
    dEl.scoreResult.innerHTML = `<div class="d-loading">解析失败，模型原始输出：</div><pre class="d-full">${esc(data._raw)}</pre>`;
    return;
  }
  const total = Number(data.total ?? 0);
  const dims = data.dimensions || {};
  const dimHtml = Object.entries(DIM_NAMES).map(([k, label]) => {
    const d = dims[k] || {};
    const sc = Number(d.score ?? 0);
    return `<div class="dim">
      <div class="dim-top"><b>${label}</b><span>${sc}</span></div>
      <div class="score-bar"><i style="width:${Math.max(0, Math.min(100, sc))}%"></i></div>
      <div class="dim-ev">${esc(d.evidence || '—')}</div>
    </div>`;
  }).join('');

  const list = (arr, cls) => arr && arr.length
    ? `<ul class="d-list ${cls}">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';

  dEl.scoreResult.innerHTML = `
    <div class="score-hero"><span class="score-num">${total}</span><span class="score-unit">/ 100</span></div>
    <div class="score-bar" style="margin-bottom:22px"><i style="width:${Math.max(0, Math.min(100, total))}%"></i></div>
    ${dimHtml}
    <div class="d-section-title">优点</div>${list(data.strengths, 'good')}
    <div class="d-section-title">短板</div>${list(data.weaknesses, 'bad')}
    <div class="d-section-title">改进建议</div>${list(data.suggestions, 'tip')}
  `;
}

dEl.scoreBtn.addEventListener('click', async () => {
  if (!drawerResume) return;
  dEl.scoreBtn.disabled = true;
  dEl.scoreBtn.textContent = '评分中…';
  dEl.scoreResult.innerHTML = '<div class="d-loading"><span class="dots"><i></i><i></i><i></i></span>正在按四个维度打分…</div>';
  try {
    const r = await fetch(`${API}/score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resume_id: drawerResume.resume_id, target_role: dEl.scoreRole.value.trim() || '大模型应用开发工程师' })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '评分失败');
    renderScore(d);
  } catch (e) {
    dEl.scoreResult.innerHTML = `<div class="d-loading" style="color:var(--ember)">评分失败：${esc(e.message)}</div>`;
  } finally {
    dEl.scoreBtn.disabled = false;
    dEl.scoreBtn.textContent = '开始评分';
  }
});

/* ---- JD 匹配 ---- */
function renderMatch(data) {
  if (data._parse_failed) {
    dEl.matchResult.innerHTML = `<div class="d-loading">解析失败，模型原始输出：</div><pre class="d-full">${esc(data._raw)}</pre>`;
    return;
  }
  const pct = Math.max(0, Math.min(100, Number(data.match_score ?? 0)));
  const STATUS = { met: '满足', partial: '部分满足', missing: '缺失' };
  const reqHtml = (data.requirements || []).map(r => `
    <div class="req">
      <div class="req-head">
        <span class="req-badge ${esc(r.status)}">${STATUS[r.status] || esc(r.status)}</span>
        <span>${esc(r.item)}</span>
      </div>
      <div class="req-ev">${esc(r.evidence)}</div>
    </div>`).join('');

  const list = (arr, cls) => arr && arr.length
    ? `<ul class="d-list ${cls}">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';

  dEl.matchResult.innerHTML = `
    <div class="match-score">
      <div class="match-ring" style="--p:${pct}"><b>${pct}</b></div>
      <div class="match-summary">${esc(data.summary || '')}</div>
    </div>
    <div class="d-section-title">逐项对照</div>
    ${reqHtml}
    <div class="d-section-title">必须项缺口</div>${list(data.must_have_gaps, 'bad')}
    <div class="d-section-title">怎么提高匹配度</div>${list(data.how_to_improve, 'tip')}
  `;
}

dEl.matchBtn.addEventListener('click', async () => {
  if (!drawerResume) return;
  const jd = dEl.jdText.value.trim();
  if (!jd) { toast('先把 JD 粘进来', 'warn'); return; }
  dEl.matchBtn.disabled = true;
  dEl.matchBtn.textContent = '分析中…';
  dEl.matchResult.innerHTML = '<div class="d-loading"><span class="dots"><i></i><i></i><i></i></span>正在逐项比对 JD…</div>';
  try {
    const r = await fetch(`${API}/match`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resume_id: drawerResume.resume_id, jd })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '分析失败');
    renderMatch(d);
  } catch (e) {
    dEl.matchResult.innerHTML = `<div class="d-loading" style="color:var(--ember)">分析失败：${esc(e.message)}</div>`;
  } finally {
    dEl.matchBtn.disabled = false;
    dEl.matchBtn.textContent = '分析匹配度';
  }
});

/* ---------------- 移动端抽屉 ---------------- */
function openRail() { el.rail.classList.add('open'); el.scrim.classList.add('on'); }
function closeRail() { el.rail.classList.remove('open'); el.scrim.classList.remove('on'); }
el.railToggle.addEventListener('click', openRail);
el.scrim.addEventListener('click', closeRail);

/* ---------------- 鼠标光斑 ---------------- */
window.addEventListener('pointermove', (e) => {
  el.spot.style.setProperty('--mx', e.clientX + 'px');
  el.spot.style.setProperty('--my', e.clientY + 'px');
  el.spot.style.opacity = '1';
});

/* ---------------- 星空粒子 ---------------- */
(function initStars() {
  const c = $('stars');
  const ctx = c.getContext('2d');
  let w, h, stars = [], raf;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = c.width = innerWidth * dpr;
    h = c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((innerWidth * innerHeight) / 14000);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 1.3 + 0.25,
      vx: (Math.random() - 0.5) * 0.075,
      vy: (Math.random() - 0.5) * 0.075,
      a: Math.random() * 0.55 + 0.15,
      tw: Math.random() * Math.PI * 2,
      tws: Math.random() * 0.012 + 0.003,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      s.x += s.vx; s.y += s.vy; s.tw += s.tws;
      if (s.x < -5) s.x = innerWidth + 5;
      if (s.x > innerWidth + 5) s.x = -5;
      if (s.y < -5) s.y = innerHeight + 5;
      if (s.y > innerHeight + 5) s.y = -5;
      const alpha = s.a * (0.65 + 0.35 * Math.sin(s.tw));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(190, 210, 245, ${alpha})`;
      ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }

  resize();
  addEventListener('resize', resize);
  if (!reduce) draw(); else {
    // 减少动态：只画一帧静态星点
    for (const s of stars) {
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(190,210,245,${s.a})`; ctx.fill();
    }
  }
})();

/* ---------------- 入场编排 ---------------- */
requestAnimationFrame(() => {
  el.rail.classList.add('in');
  el.topbar.classList.add('in');
  el.composerWrap.classList.add('in');
});

/* ---------------- 启动 ---------------- */
setSendState();
loadResumes();
</script>
